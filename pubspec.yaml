name: libpq_dart
version: 2.1.0
description: >-
  PostgreSQL client for Dart over libpq: FFI bindings, a synchronous API, and an
  asynchronous API and pool that never block the event loop.
homepage: https://github.com/insinfo/libpq_dart
repository: https://github.com/insinfo/libpq_dart
issue_tracker: https://github.com/insinfo/libpq_dart/issues
topics:
  - database
  - postgresql
  - ffi
  - libpq

environment:
  sdk: ^3.6.0

dependencies: 
  path: ^1.9.0
  ffi: ^2.1.0  

dev_dependencies:
  ffigen: ^11.0.0
  lints: ^5.1.1
  test: ^1.25.0


ffigen:
  name: 'LibpqBindings'
  llvm-path:  
    - 'C:\llvm'
  output: 'lib/src/generated_bindings.dart'
  headers:
    entry-points:            
      - 'libpq\include\libpq-fe.h'        
    include-directives:
      - 'libpq\include\**'

